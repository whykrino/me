<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>krino · резюме</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">

    <script>
        (function () {
            var t = localStorage.getItem('krino-theme');
            if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        })();
    </script>
</head>
<body>
    <div class="preloader" id="preloader">
        <div class="terminal" id="terminal">
            <div class="terminal-bar">
                <span class="dot dot-red"></span>
                <span class="dot dot-yellow"></span>
                <span class="dot dot-green"></span>
                <span class="terminal-title">krino@server: ~</span>
            </div>
            <div class="terminal-body" id="terminalBody"></div>
        </div>
    </div>

    <header class="topbar">
        <h1 class="logo">krino</h1>

        <div class="topbar-right">
            <nav class="nav-menu" id="navMenu"></nav>
            <button class="theme-toggle" id="themeToggle" aria-label="Переключить тему" title="Сменить тему">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </header>

    <main class="resume-container" id="resumeContainer"></main>

    <script src="js/data.js" defer></script>
    <script src="js/render.js" defer></script>
    <script src="js/app.js" defer></script>
</body>
</html>
